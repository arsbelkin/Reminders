<button
  #accountButton
  class="account-button"
  type="button"
  aria-label="Меню аккаунта"
  title="Аккаунт"
  [attr.aria-expanded]="menuOpen()"
  [attr.aria-controls]="menuOpen() ? 'account-options' : null"
  (click)="toggleMenu()"
>
  @if (avatarUrl(); as url) {
    <img [src]="url" alt="" (error)="avatarUrl.set(null)" />
  } @else {
    <svg
      class="default-avatar"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="12" cy="8.5" r="3.5" />
      <path d="M5 21v-2a7 7 0 0 1 14 0v2" />
    </svg>
  }
</button>

@if (menuOpen()) {
  <div id="account-options" class="account-options" role="group" aria-label="Аккаунт">
    <p class="menu-heading">Мой аккаунт</p>
    <a class="account-option" routerLink="/profile" (click)="closeMenu()">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="8" r="3" />
        <path d="M5 21v-2a7 7 0 0 1 14 0v2" />
      </svg>
      <span>Профиль</span>
    </a>
    <div class="menu-divider"></div>
    <button class="account-option" type="button" (click)="logout()">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M10 12h11m-4-4 4 4-4 4" />
      </svg>

      <span>Выйти</span>
    </button>
  </div>
}
