<dialog
  #categoryDialog
  class="category-dialog"
  aria-labelledby="category-create-title"
  aria-describedby="category-create-description"
  (cancel)="onCancel($event)"
>
  <form class="category-form" [formGroup]="form" (ngSubmit)="save()" [attr.aria-busy]="isSaving()">
    <div class="dialog-heading">
      <span class="heading-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" />
          <path d="M9 13h6M12 10v6" />
        </svg>
      </span>
      <div class="heading-copy">
        <h2 id="category-create-title">Новая категория</h2>
        <p id="category-create-description">Соберите связанные напоминания вместе</p>
      </div>
      <button class="close-button" type="button" aria-label="Закрыть создание категории"
        [disabled]="isSaving()" (click)="close()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18" />
        </svg>
      </button>
    </div>

    <div class="dialog-body">
      <fieldset [disabled]="isSaving()">
        <legend class="visually-hidden">Данные категории</legend>

        <div class="form-field">
          <label for="category-title">Название <span class="required-mark" aria-hidden="true">*</span></label>
          <input
            id="category-title"
            type="text"
            formControlName="title"
            placeholder="Например, Работа или Личное"
            aria-required="true"
            [attr.aria-invalid]="form.controls.title.touched && form.controls.title.invalid"
            [attr.aria-describedby]="form.controls.title.touched && form.controls.title.invalid ? 'category-title-error' : null"
            autofocus
          />
          @if (form.controls.title.touched && form.controls.title.invalid) {
            <p id="category-title-error" class="field-error" role="alert">Введите название категории.</p>
          }
        </div>

        <div class="form-field">
          <label for="category-description">Описание <span class="optional-label">Необязательно</span></label>
          <textarea id="category-description" formControlName="description" rows="4"
            placeholder="О чём эта категория?" aria-describedby="category-description-hint"></textarea>
          <p id="category-description-hint" class="field-hint">Короткая заметка, чтобы не забыть важное.</p>
        </div>
        <app-members-editor formControlName="usersEmails" inputId="category-create-members" [disabled]="isSaving()" />
      </fieldset>

      @if (errorMessage()) {
        <div class="form-error" role="alert">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
            stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7v6m0 4h.01" />
          </svg>
          <p>{{ errorMessage() }}</p>
        </div>
      }
    </div>

    <div class="dialog-actions">
      <button class="cancel-button" type="button" [disabled]="isSaving()" (click)="close()">Отмена</button>
      <button class="save-button" type="submit" [disabled]="isSaving()">
        @if (isSaving()) {
          <span class="saving-spinner" aria-hidden="true"></span>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14" />
          </svg>
        }
        {{ isSaving() ? 'Создаём…' : 'Создать категорию' }}
      </button>
    </div>
  </form>
</dialog>
