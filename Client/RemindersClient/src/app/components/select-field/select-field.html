<button #trigger type="button" class="select-trigger" [class.category]="category()" [class.placeholder]="!selected()"
  [id]="inputId()" role="combobox" aria-haspopup="listbox" [attr.aria-expanded]="expanded()"
  [attr.aria-controls]="inputId() + '-options'" [attr.aria-labelledby]="inputId() + '-label'"
  [attr.aria-required]="required()" [attr.aria-invalid]="invalid()" [attr.aria-describedby]="describedBy()"
  [attr.aria-activedescendant]="expanded() && options().length ? inputId() + '-option-' + activeIndex() : null"
  [disabled]="blocked()" (pointerdown)="onPointerDown($event)" (click)="toggle()" (keydown)="onKeydown($event)">
  @if (category()) { <svg class="category-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg> }
  <span class="selected-label">{{ selected()?.label ?? placeholder() }}</span>
  <svg class="chevron" [class.rotated]="expanded()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
</button>
<div #panel class="select-panel" [class.fallback-open]="expanded() && !nativePopover()"
  [id]="inputId() + '-options'" role="listbox" [attr.aria-labelledby]="inputId() + '-label'"
  [style.top.px]="nativePopover() ? panelTop() : null" [style.left.px]="nativePopover() ? panelLeft() : null"
  [style.width.px]="nativePopover() ? panelWidth() : null" [style.max-height.px]="panelHeight()"
  (keydown)="onKeydown($event)">
  @if (expanded()) {
    @for (option of options(); track option.value; let i = $index) {
      <button type="button" class="select-option" role="option" tabindex="-1"
        [id]="inputId() + '-option-' + i" [attr.aria-selected]="option.value === value()"
        [class.active]="activeIndex() === i" [class.selected]="option.value === value()"
        [disabled]="blocked()" (click)="choose(i)">
        <span>{{ option.label }}</span>
        @if (option.value === value()) { <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg> }
      </button>
    } @empty { <p class="empty-options">Нет доступных вариантов</p> }
  }
</div>
