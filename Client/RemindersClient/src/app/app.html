<header class="header">
  <a class="header__brand" routerLink="/reminders">
    <svg
      class="header__logo"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <rect x="5" y="3" width="15" height="18" rx="2" />
      <path d="M9 3v18M3 7h4M3 12h4M3 17h4" />
      <path d="M12 8h5M12 12h5M12 16h3" />
    </svg>

    <span class="header__name">Reminders</span>
  </a>
  @if (tokenStorage.token()) {
    <div class="header__actions">
    @if (tokenStorage.isAdmin()) {
      <a class="header__notifications header__reports" routerLink="/reports" routerLinkActive="header__notifications--active"
        ariaCurrentWhenActive="page" aria-label="Отчёты" title="Отчёты">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 16v-3M12 16V8M16 16v-5"/></svg>
        <span>Отчёты</span>
      </a>
    }
    <a class="header__notifications" routerLink="/notifications" routerLinkActive="header__notifications--active"
      ariaCurrentWhenActive="page" aria-label="Уведомления" title="Уведомления">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
      <span>Уведомления</span>
    </a>
    <app-account-menu />
    </div>
  }
</header>

<main class="page-content">
  <router-outlet />
</main>

<footer class="footer">
  <span class="footer__brand">Reminders</span>
  <small>© 2026 · Сервис напоминаний</small>
</footer>
